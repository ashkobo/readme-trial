name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run verify:package
      - run: npm pack --ignore-scripts
      - name: Test the packaged API from the README
        run: >-
          node src/cli.js --package ./ashkobo-readme-trial-0.1.0.tgz
          --readme README.md --json trial-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ matrix.os }}-${{ matrix.node }}
          path: trial-report.json
